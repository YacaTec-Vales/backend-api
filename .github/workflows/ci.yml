name: Backend CI

on:
  pull_request:
    branches: [develop, staging, main]
  push:
    branches: [develop, staging, main, 'release/**']

# Cancela runs anteriores del mismo PR para no desperdiciar
# minutos de CI en pushes viejos.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ESLint sin warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Instalar dependencias
        run: npm ci
      # Regla dura del proyecto: `npm run lint` debe terminar con
      # 0 problemas (errores y warnings). Ver
      # docu/backend.md seccion 17.1 "Checklist obligatorio".
      - name: ESLint (sin warnings)
        run: npm run lint

  quality:
    name: Quality (lint + typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Lint
        run: npm run lint:check
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  unit-coverage:
    name: Unit tests + coverage
    needs: [lint, quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Unit + coverage (umbral 80 % enforced por Jest)
        run: npm run test:cov:unit
      - name: Subir artifact de coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage/
          retention-days: 14

  integration:
    name: Integration tests
    needs: [lint, quality]
    runs-on: ubuntu-latest
    # Levanta un PostgreSQL para integration y e2e. Sustituir
    # por Testcontainers o una BD de pruebas dedicada cuando
    # este disponible.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vales_yacatec_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: vales_yacatec_test
      DATABASE_READ_HOST: 127.0.0.1
      DATABASE_READ_PORT: 5432
      DATABASE_READ_USER: postgres
      DATABASE_READ_PASSWORD: postgres
      DATABASE_READ_NAME: vales_yacatec_test
      JWT_SECRET: ci-jwt-secret-32-chars-min-1234567890
      MFA_SECRET_KEY: ci-mfa-secret-32-chars-min-1234567890
      NODE_ENV: test
      SMTP_HOST: ''
      # Variables STORAGE_* requeridas por envValidationSchema
      # (`src/config/env.validation.ts`). Apuntan a valores
      # placeholder validos (Joi.uri) para que el bootstrap
      # no rechace el modulo; los tests de integration no
      # invocan endpoints de storage.
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET: vales-yacatec-test
      STORAGE_ACCESS_KEY_ID: ci-access-key
      STORAGE_SECRET_ACCESS_KEY: ci-secret-key
      STORAGE_FORCE_PATH_STYLE: 'true'
      STORAGE_PUBLIC_BASE_URL: http://localhost:9000/vales-yacatec-test
      STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Aplicar schema (placeholder)
        run: echo "Las migraciones las aplica el equipo de infraestructura. Aplicar manualmente antes de habilitar este job."
      - name: Integration tests
        run: npm run test:integration -- --forceExit
        continue-on-error: true

  e2e:
    name: E2E tests
    needs: [lint, quality]
    runs-on: ubuntu-latest
    # Limite defensivo para evitar el caso conocido de e2e
    # que se quedaba colgado ~5h por handles abiertos de
    # ALS/Drizzle. 20 min alcanza para cualquier suite;
    # si se cuelga, el job termina con `cancelled` y el
    # agregador `ci-required` lo trata como fallo limpio.
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vales_yacatec_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: vales_yacatec_test
      DATABASE_READ_HOST: 127.0.0.1
      DATABASE_READ_PORT: 5432
      DATABASE_READ_USER: postgres
      DATABASE_READ_PASSWORD: postgres
      DATABASE_READ_NAME: vales_yacatec_test
      JWT_SECRET: ci-jwt-secret-32-chars-min-1234567890
      MFA_SECRET_KEY: ci-mfa-secret-32-chars-min-1234567890
      NODE_ENV: test
      SMTP_HOST: ''
      # Variables STORAGE_* requeridas por envValidationSchema.
      # Los e2e actuales no invocan endpoints de storage, asi
      # que cualquier URL valida (Joi.uri) alcanza; cualquier
      # carga real apuntara al MinIO del runner cuando se
      # agreguen tests de upload.
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET: vales-yacatec-test
      STORAGE_ACCESS_KEY_ID: ci-access-key
      STORAGE_SECRET_ACCESS_KEY: ci-secret-key
      STORAGE_FORCE_PATH_STYLE: 'true'
      STORAGE_PUBLIC_BASE_URL: http://localhost:9000/vales-yacatec-test
      STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: E2E tests
        # --forceExit: evita el cuelgue de Jest por handles
        # abiertos (pool Drizzle / ALS de auditoria) que
        # antes dejaba el job corriendo hasta el timeout
        # del runner (~6h) y disparaba el bug que bloqueaba
        # la PR del feature.
        run: npm run test:e2e -- --forceExit
        continue-on-error: true

  ci-required:
    name: CI Required (agregador)
    needs:
      - lint
      - quality
      - unit-coverage
      - integration
      - e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Resumen
        run: |
          echo "lint:           ${{ needs.lint.result }}"
          echo "quality:        ${{ needs.quality.result }}"
          echo "unit-coverage:  ${{ needs.unit-coverage.result }}"
          echo "integration:    ${{ needs.integration.result }}"
          echo "e2e:            ${{ needs.e2e.result }}"
          # `lint` y `quality` y `unit-coverage` son bloqueantes.
          # `integration` y `e2e` se monitorean pero aun no son
          # bloqueantes (siguen en `continue-on-error: true`).
          if [[ "${{ needs.lint.result }}" != "success" || \
                "${{ needs.quality.result }}" != "success" || \
                "${{ needs.unit-coverage.result }}" != "success" ]]; then
            echo "Fallo critico: lint, quality o unit-coverage no son success."
            exit 1
          fi
          if [[ "${{ needs.integration.result }}" == "failure" || \
                "${{ needs.e2e.result }}" == "failure" ]]; then
            echo "Fallo critico: integration o e2e no pasaron."
            exit 1
          fi
          echo "CI backend OK."
