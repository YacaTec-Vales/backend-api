name: Release

# Se lanza DESPUES de que "Auto Release" (semantic-release) termina,
# para usar la version CALCULADA (ej. v0.1.1-rc.1) y no el numero que
# se ponga a mano en el nombre de la rama release/v*.
on:
  workflow_run:
    workflows: ["Auto Release"]
    types:
      - completed
    branches:
      - 'release/**'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build
        run: npm run build

      - name: Instalar solo prod (para el artefacto)
        run: npm ci --omit=dev --ignore-scripts

      - name: Obtener version de la release generada por semantic-release
        run: |
          TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [[ -z "${TAG}" ]]; then
            TAG="${WORKFLOW_BRANCH#release/}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_ENV"
        env:
          WORKFLOW_BRANCH: ${{ github.event.workflow_run.head_branch }}

      - name: Empaquetar artefacto
        run: |
          mkdir -p /tmp/release
          tar -czf "/tmp/release/backend-api-${tag}.tar.gz" \
            dist package.json package-lock.json node_modules
          echo "asset=backend-api-${tag}.tar.gz" >> "$GITHUB_ENV"

      - name: Subir artefacto a la release (prerelease)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${tag}" "/tmp/release/${asset}" --clobber
