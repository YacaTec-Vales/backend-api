name: Release

on:
  push:
    branches:
      - 'release/**'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build
        run: npm run build

      - name: Instalar solo prod (para el artefacto)
        run: npm ci --omit=dev

      - name: Empaquetar artefacto
        run: |
          TAG="${GITHUB_REF_NAME#release/}"
          mkdir -p /tmp/release
          tar -czf "/tmp/release/backend-api-${TAG}.tar.gz" \
            dist package.json package-lock.json node_modules
          echo "asset=backend-api-${TAG}.tar.gz" >> "$GITHUB_ENV"

      - name: Crear GitHub Release v0.0.1 (o actualizar)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME#release/}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "/tmp/release/${asset}" --clobber
          else
            gh release create "${TAG}" "/tmp/release/${asset}" \
              --title "backend-api ${TAG}" \
              --notes "Artifact de prueba para el flujo de versionado (build automatico)."
          fi
